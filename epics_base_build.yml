---
- name: Install EPICS base from source
  hosts: all
  become: true
  vars:
    epics_base_version: "7.0.10"
    epics_base_repo: "https://github.com/epics-base/epics-base.git"
    epics_base_src_dir: "/opt/epics/base"

  tasks:
    - name: Install build dependencies
      ansible.builtin.package:
        name:
          - gcc
          - gcc-c++
          - make
          - readline-devel
          - perl
          - git
        state: present

    - name: Clone EPICS base repository
      ansible.builtin.git:
        repo: "{{ epics_base_repo }}"
        dest: "{{ epics_base_src_dir }}"
        version: "R{{ epics_base_version }}"
        force: true
        update: true

    - name: Build EPICS base
      ansible.builtin.command:
        cmd: make
        chdir: "{{ epics_base_src_dir }}"
        creates: "{{ epics_base_src_dir }}/bin"

    - name: Install EPICS environment profile script
      ansible.builtin.copy:
        dest: /etc/profile.d/epics.sh
        mode: "0644"
        content: |
          export EPICS_BASE={{ epics_base_src_dir }}
          export EPICS_HOST_ARCH=$(${EPICS_BASE}/startup/EpicsHostArch)
          export PATH=${EPICS_BASE}/bin/${EPICS_HOST_ARCH}:${PATH}


