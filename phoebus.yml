---
- hosts: all
  become: true
  roles:
    - role: phoebus_resources
    - role: org.phoebus.phoebus_dependencies
    - role: org.phoebus.phoebus_tools
  vars:
    phoebus_resources_config:
      repo: "https://github.com/eicorg/eic-phoebus-resources.git"
      version: "main"
      basedir: /opt/eic-phoebus-resources
      configdir: /opt/eic-phoebus-resources/configuration
      user: eicuser
    phoebus_dependencies_account: eicuser
    phoebus_tools_owner: eicuser
    phoebus_tools_install_launcher: true
    phoebus_tools_install_preferences: false
    phoebus_tools_preferences_file: "{{ phoebus_resources_config.basedir }}/preferences/pref.ini"

