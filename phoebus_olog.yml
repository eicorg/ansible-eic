---
- hosts: all
  become: true
  roles:
    - role: org.phoebus.phoebus_dependencies
    - role: org.phoebus.phoebus_services_elasticsearch
    - role: org.phoebus.phoebus_services_mongodb
    - role: org.phoebus.phoebus_tools
    - role: org.phoebus.phoebus_services_phoebus_olog
  vars:
    phoebus_tools_owner: eicuser
    phoebus_dependencies_account: eicuser
    phoebus_services_elasticsearch_account: eicuser
    phoebus_services_mongodb_account: eicuser
    phoebus_services_phoebus_olog_account: eicuser
    phoebus_services_phoebus_olog_cors_allowed_origins: http://localhost:4000
    phoebus_services_phoebus_olog_webclient_account: eicuser
