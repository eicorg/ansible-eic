---
- name: Gather and Save FirewallD Configuration
  hosts: all
  become: yes
  gather_facts: no

  tasks:
    - name: Get list of FirewallD zones
      command: firewall-cmd --get-zones
      register: firewalld_zones
      changed_when: false

    - name: Get default zone
      command: firewall-cmd --get-default-zone
      register: default_zone
      changed_when: false

    - name: Gather configuration for each zone
      command: firewall-cmd --zone={{ item }} --list-all
      loop: "{{ firewalld_zones.stdout.split() }}"
      register: zone_configs
      changed_when: false

    - name: Get list of services
      command: firewall-cmd --get-services
      register: firewalld_services
      changed_when: false

    - name: Save FirewallD configuration to file
      copy:
        content: |
          FirewallD Configuration for {{ inventory_hostname }}
          ===============================================

          Default Zone: {{ default_zone.stdout }}

          Zone Configurations:
          {% for zone in zone_configs.results %}
          {{ zone.stdout }}
          {% endfor %}

          Available Services: 
          {{ firewalld_services.stdout.split() | sort | join(', ') }}
        dest: "/tmp/firewalld_config_{{ inventory_hostname }}.txt"
      delegate_to: localhost

    - name: Inform about saved configuration
      debug:
        msg: "FirewallD configuration for {{ inventory_hostname }} has been saved to /tmp/firewalld_config_{{ inventory_hostname }}.txt on the Ansible control node."
