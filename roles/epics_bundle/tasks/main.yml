---
- name: Validate EPICS bundle inputs
  ansible.builtin.assert:
    that:
      - epics_bundle_url | length > 0
      - ansible_pkg_mgr in ['dnf', 'yum']
    fail_msg: >-
      Set epics_bundle_url on a yum/dnf-managed host.

- name: Ensure EPICS bundle workspace exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ epics_bundle_work_dir }}"

- name: Resolve EPICS bundle filename
  ansible.builtin.set_fact:
    epics_bundle_download_path: >-
      {{
        epics_bundle_work_dir ~ '/' ~ (
          epics_bundle_filename
          if (epics_bundle_filename | default('') | length > 0)
          else (epics_bundle_url | regex_replace('^.*/', '') | regex_replace('\\?.*$', ''))
        )
      }}

- name: Download EPICS bundle
  ansible.builtin.get_url:
    url: "{{ epics_bundle_url }}"
    dest: "{{ epics_bundle_download_path }}"
    force: "{{ epics_bundle_force_download }}"
    timeout: "{{ epics_bundle_download_timeout }}"
    mode: "0644"

- name: Install EPICS RPMs with dnf
  ansible.builtin.dnf:
    name: "{{ epics_bundle_download_path }}"
    state: present
    disable_gpg_check: "{{ epics_bundle_disable_gpg_check }}"
  when: ansible_pkg_mgr == 'dnf'

- name: Install EPICS RPMs with yum
  ansible.builtin.yum:
    name: "{{ epics_bundle_download_path }}"
    state: present
    disable_gpg_check: "{{ epics_bundle_disable_gpg_check }}"
  when: ansible_pkg_mgr == 'yum'

- name: Clean up EPICS bundle workspace
  ansible.builtin.file:
    path: "{{ epics_bundle_work_dir }}"
    state: absent
  when: epics_bundle_cleanup | bool
